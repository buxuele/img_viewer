<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>照片查看器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5M7.5 10.5h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5M7.5 10.5h6M10.5 7.5v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.6" fill="currentColor"/><path d="m4 17 5-4 3.5 2.6L17 11l3 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-rotate-left" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2.3 7.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 4v6h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-rotate-right" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2.3 7.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 4v6h-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app-window">
    <header class="titlebar">
      <div class="titlebar-left"><svg class="titlebar-icon"><use href="#i-image"/></svg></div>
      <div class="window-title" id="window-title">照片查看器</div>
      <div class="window-controls">
        <button type="button" class="window-button" id="fullscreen-button" title="全屏" aria-label="全屏"><svg><use href="#i-expand"/></svg></button>
        <button type="button" class="window-button close" id="close-button" title="关闭" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
      </div>
    </header>

    <section class="library" id="library">
      <div class="library-head">
        <div class="open-row">
          <button type="button" class="primary-button" id="pick-folder"><svg><use href="#i-folder"/></svg>打开文件夹</button>
          <input type="text" id="path-input" class="path-input" placeholder="或输入文件夹完整路径" spellcheck="false">
          <button type="button" class="plain-button" id="path-open">打开</button>
        </div>
        <div class="recent" id="recent"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="grid-empty" id="grid-empty" hidden>这个文件夹里没有可显示的图片</div>
      <div class="pager" id="pager"></div>
    </section>

    <section class="viewer" id="viewer" hidden>
      <div class="stage" id="stage">
        <button type="button" class="nav-button prev" id="prev-button" aria-label="上一张"><svg><use href="#i-chevron-left"/></svg></button>
        <div class="canvas" id="canvas"><img id="photo" alt=""></div>
        <button type="button" class="nav-button next" id="next-button" aria-label="下一张"><svg><use href="#i-chevron-right"/></svg></button>
        <div class="stage-note" id="loading" hidden>正在打开图片</div>
        <div class="stage-note error" id="photo-error" hidden>无法显示这张图片，格式可能不受支持</div>
      </div>
      <footer class="toolbar" id="toolbar">
        <div class="zoom-group">
          <button type="button" class="icon-button" id="zoom-out" title="缩小" aria-label="缩小"><svg><use href="#i-zoom-out"/></svg></button>
          <input type="range" id="zoom-slider" class="zoom-slider" min="0" max="100" step="1" value="0" aria-label="缩放">
          <button type="button" class="icon-button" id="zoom-in" title="放大" aria-label="放大"><svg><use href="#i-zoom-in"/></svg></button>
          <span class="zoom-label" id="zoom-label">100%</span>
        </div>
        <div class="toolbar-sep"></div>
        <button type="button" class="tool-button" id="fit-button" title="在适应窗口与实际大小之间切换（Ctrl+0）">实际大小</button>
        <div class="toolbar-sep"></div>
        <button type="button" class="tool-button" id="rotate-left" title="逆时针旋转 90 度（Ctrl+,）"><svg><use href="#i-rotate-left"/></svg>逆时针旋转</button>
        <button type="button" class="tool-button" id="rotate-right" title="顺时针旋转 90 度（Ctrl+.）"><svg><use href="#i-rotate-right"/></svg>顺时针旋转</button>
        <div class="toolbar-sep"></div>
        <button type="button" class="tool-button danger" id="delete-button" title="删除这张图片（Delete）"><svg><use href="#i-trash"/></svg>删除</button>
        <div class="counter" id="counter">第 1 张 / 共 1 张</div>
      </footer>
    </section>
  </div>

  <div class="slideshow" id="slideshow" hidden>
    <img id="slideshow-photo" alt="">
    <div class="slideshow-hint">按 Esc 退出幻灯片，左右方向键切换</div>
  </div>

  <dialog class="dialog" id="confirm-dialog">
    <h2 class="dialog-title">删除图片</h2>
    <p class="dialog-text" id="confirm-text"></p>
    <div class="dialog-actions">
      <button type="button" class="plain-button" id="confirm-cancel">取消</button>
      <button type="button" class="danger-button" id="confirm-delete">放入废纸篓</button>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
