name: 构建 DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 运行逻辑测试
        run: bash tests/run_tests.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 构建通用应用
        run: |
          xcodebuild \
            -project ImgViewer.xcodeproj \
            -scheme ImgViewer \
            -configuration Release \
            -derivedDataPath .build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 DMG
        run: bash scripts/package_dmg.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ImgViewer-dmg
          path: dist/*.dmg

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
